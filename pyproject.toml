[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ipi-eval"
version = "1.0.1"
description = "Evidence-backed workbench for agentic indirect prompt-injection evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.26,<2",
  "psutil>=5.9,<8",
  "openpyxl>=3.1,<4",
  "paramiko>=4,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]
release = [
  "pyinstaller>=6.0,<7",
  "pywebview>=6.2,<7",
]

[project.scripts]
agentic-ipi-workbench = "cursor_dynamic_eval.workbench.__main__:main"
experiment-workbench = "cursor_dynamic_eval.workbench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cursor_dynamic_eval.workbench" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
